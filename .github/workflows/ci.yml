name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package and verify macOS signature
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac dir --arm64 --publish never
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/HiveDesk.app
          codesign -dv release/mac-arm64/HiveDesk.app 2>&1 | grep -E "Signature=adhoc|Identifier"
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
