appId: com.tatogames.hivedesk
productName: HiveDesk
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# macOS: ad-hoc signature (see build/afterPack.cjs)
afterPack: build/afterPack.cjs
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # No Developer ID yet: electron-builder's own signing is skipped and
  # build/afterPack.cjs applies an ad-hoc signature instead.
  identity: null
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: Development
publish:
  provider: github
  owner: TatoGames
  repo: Hive-Desk
  releaseType: release
