appId: com.tatogames.hivedesk
productName: HiveDesk
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# macOS: ad-hoc signature (see build/afterPack.cjs)
afterPack: build/afterPack.cjs
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    # portable: the .app plus portable.flag in a zip (portable.flag at the repo root, see extraDistFiles)
    - target: zip
      arch: [arm64, x64]
  # only the zip target is affected (the dmg name is pinned by the dmg: block)
  artifactName: ${productName}-${version}-${arch}-mac-portable.${ext}
  # copied next to the .app, only into the zip (the dmg is built from the .app alone)
  extraDistFiles:
    - portable.flag
  category: public.app-category.developer-tools
  # No Developer ID yet: electron-builder's own signing is skipped and
  # build/afterPack.cjs applies an ad-hoc signature instead.
  identity: null
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: HiveDesk-Portable-${version}.${ext}
# dmg keeps its default name explicitly because mac.artifactName (below) names the zip
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: [AppImage]
  category: Development
publish:
  provider: github
  owner: TatoGames
  repo: Hive-Desk
  releaseType: release
