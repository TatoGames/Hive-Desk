appId: com.tatogames.hivedesk
productName: HiveDesk
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Not code-signed yet. See README "macOS에서 '손상된 앱' 경고가 뜰 때".
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: Development
publish:
  provider: github
  owner: TatoGames
  repo: Hive-Desk
  releaseType: release
